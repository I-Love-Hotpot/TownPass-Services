name: PR Preview CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  # ---------------------------------
  # 1. 建置映像檔 Job (透過 Kaniko 執行)
  # ---------------------------------
  build:
    runs-on: k8s-dynamic-runner

    # 直接在此 Job 指定使用 Kaniko 官方執行容器
    container:
      image: gcr.io/kaniko-project/executor:v1.24.0-debug
      options: --user root

    steps:
      - name: Get PR Number
        id: pr
        run: echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      # Kaniko 容器內預設沒有 git checkout action，但它支援直接透過 --context 抓取遠端分支或結合認證打包
      - name: Build and Push with Kaniko
        if: github.event.action != 'closed'
        run: |
          mkdir -p /kaniko/.docker
          echo "{\"auths\":{\"ghcr.io\":{\"username\":\"${{ github.actor }}\",\"password\":\"${{ secrets.GITHUB_TOKEN }}\"}}}" > /kaniko/.docker/config.json

          /kaniko/executor \
            --context=git://github.com/${{ github.repository }}.git#refs/pull/${{ github.event.pull_request.number }}/merge \
            --dockerfile=Dockerfile \
            --destination=ghcr.io/${{ github.repository_owner }}/townpass-preview:pr-${{ github.event.pull_request.number }}

  # ---------------------------------
  # 2. 部署預覽環境 Job (透過 Helm 執行)
  # ---------------------------------
  deploy:
    runs-on: k8s-dynamic-runner
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get PR Number
        id: pr
        run: echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Cleanup Environment
        if: github.event.action == 'closed'
        run: |
          RELEASE_NAME="pr-${{ steps.pr.outputs.number }}"
          helm uninstall $RELEASE_NAME --namespace townpass || true

      - name: Deploy with Helm
        if: github.event.action != 'closed'
        run: |
          RELEASE_NAME="pr-${{ steps.pr.outputs.number }}"
          helm upgrade --install $RELEASE_NAME .helm/preview-app \
            --namespace townpass \
            --set image.repository=ghcr.io/${{ github.repository_owner }}/townpass-preview \
            --set image.tag=pr-${{ steps.pr.outputs.number }}

      - name: Comment Preview URL
        if: github.event.action != 'closed'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            🚀 **PR 預覽環境已上線！**
            - 🌐 預覽網址: https://pr-${{ steps.pr.outputs.number }}.k8s.dstw.dev
