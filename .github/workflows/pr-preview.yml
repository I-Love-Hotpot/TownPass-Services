name: PR Preview CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  # ---------------------------------
  # 1. 建置映像檔 Job (透過 Kaniko 執行)
  # ---------------------------------
  build:
    runs-on: k8s-dynamic-runner

    steps:
      - name: Get PR Number
        id: pr
        run: echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      # 使用成熟且支援在無 Docker 環境下運行的 Kaniko Action
      - name: Build and Push with Kaniko
        uses: int128/kaniko-action@v1
        with:
          context: .
          dockerfile: Dockerfile
          destination: ghcr.io/${{ github.repository_owner }}/townpass-preview:pr-${{ steps.pr.outputs.number }}
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------
  # 2. 部署預覽環境 Job (透過 Helm 執行)
  # ---------------------------------
  deploy:
    runs-on: k8s-dynamic-runner
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get PR Number
        id: pr
        run: echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Cleanup Environment
        if: github.event.action == 'closed'
        run: |
          RELEASE_NAME="pr-${{ steps.pr.outputs.number }}"
          helm uninstall $RELEASE_NAME --namespace townpass || true

      - name: Deploy with Helm
        if: github.event.action != 'closed'
        run: |
          RELEASE_NAME="pr-${{ steps.pr.outputs.number }}"
          helm upgrade --install $RELEASE_NAME .helm/preview-app \
            --namespace townpass \
            --set image.repository=ghcr.io/${{ github.repository_owner }}/townpass-preview \
            --set image.tag=pr-${{ steps.pr.outputs.number }}

      - name: Comment Preview URL
        if: github.event.action != 'closed'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            🚀 **PR 預覽環境已上線！**
            - 🌐 預覽網址: https://pr-${{ steps.pr.outputs.number }}.k8s.dstw.dev
