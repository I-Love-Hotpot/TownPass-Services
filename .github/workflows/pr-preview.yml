name: PR Preview CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  build-and-deploy:
    runs-on: k8s-dynamic-runner

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get PR Number
        id: pr
        run: echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      # 1. 使用官方 Kaniko Action 進行無特權打包與推送（不需要 docker.sock）
      - name: Build and Push with Kaniko
        if: github.event.action != 'closed'
        uses: GoogleContainerTools/kaniko-action@v3
        with:
          context: .
          dockerfile: Dockerfile
          destination: ghcr.io/${{ github.repository_owner }}/townpass-preview:pr-${{ steps.pr.outputs.number }}
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}

      # 2. 清理環境 (PR 關閉時)
      - name: Cleanup Environment
        if: github.event.action == 'closed'
        run: |
          RELEASE_NAME="pr-${{ steps.pr.outputs.number }}"
          helm uninstall $RELEASE_NAME --namespace townpass || true

      # 3. 使用 Helm 部署預覽環境
      - name: Log in to GHCR
        if: github.event.action != 'closed'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and Push Docker Image
        if: github.event.action != 'closed'
        run: |
          IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/townpass-preview:pr-${{ steps.pr.outputs.number }}"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      # 4. 自動在 PR 下方留言預覽網址
      - name: Comment Preview URL
        if: github.event.action != 'closed'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            🚀 **PR 預覽環境已上線！**
            - 🌐 預覽網址: https://pr-${{ steps.pr.outputs.number }}.k8s.dstw.dev
